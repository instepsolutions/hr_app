spring.application.name=hrms-backend

# Oracle DataSource
spring.datasource.url=${HRMS_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${HRMS_DATASOURCE_USERNAME:hrms_app}
spring.datasource.password=${HRMS_DATASOURCE_PASSWORD:HrmsApp#2025}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Server
server.port=8080

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# JWT foundation
jwt.secret=${JWT_SECRET:hrms-dev-secret-key-change-in-production-1234567890}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
